name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # postinstall runs `prisma generate`, which does not need a database.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Fake values only: the build checks that the code compiles, it never talks to Supabase.
      - run: npm run build
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/ci
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
